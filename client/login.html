<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login — Snitch</title>
    <meta name="description" content="Login to your Snitch account." />
    <link rel="stylesheet" href="assets/css/style.css" />
</head>
<body>

<nav class="navbar">
    <a href="index.html" class="navbar-brand"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 2L3 6v14a2 2 0 002 2h14a2 2 0 002-2V6l-3-4z"/><line x1="3" y1="6" x2="21" y2="6"/><path d="M16 10a4 4 0 01-8 0"/></svg> Snitch</a>
    <ul class="navbar-nav">
        <li><a href="index.html">Home</a></li>
    </ul>
</nav>

<div id="toastContainer" class="toast-container"></div>

<div class="auth-wrapper">
    <div class="auth-card">
        <h2>Welcome back</h2>
        <p>Sign in to continue shopping</p>

        <form id="loginForm">
            <div class="form-group">
                <label class="form-label">Email</label>
                <input type="email" id="email" class="form-control" placeholder="you@example.com" required />
            </div>
            <div class="form-group">
                <label class="form-label">Password</label>
                <input type="password" id="password" class="form-control" placeholder="••••••••" required />
            </div>
            <div id="formError" class="form-error" style="margin-bottom:10px"></div>
            <button type="submit" class="btn btn-primary btn-full" id="loginBtn">Login</button>
        </form>

        <div class="auth-footer">
            Don't have an account? <a href="register.html">Register</a>
        </div>
    </div>
</div>

<script type="module">
import { api, setToken, setUser, getUser } from './assets/js/api.js';

if (getUser()) location.href = 'index.html';

function toast(msg, type = 'info') {
    const c = document.getElementById('toastContainer');
    const t = document.createElement('div');
    t.className = `toast toast-${type}`;
    t.textContent = msg;
    c.appendChild(t);
    setTimeout(() => t.remove(), 3000);
}

document.getElementById('loginForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const btn = document.getElementById('loginBtn');
    const errEl = document.getElementById('formError');
    errEl.textContent = '';
    btn.disabled = true;
    btn.textContent = 'Signing in...';

    try {
        const data = await api.auth.login({
            email: document.getElementById('email').value,
            password: document.getElementById('password').value,
        });
        setToken(data.accessToken);
        setUser(data.userData);
        toast('Logged in! ', 'success');
        setTimeout(() => location.href = 'index.html', 800);
    } catch (err) {
        errEl.textContent = err.message || 'Login failed';
        btn.disabled = false;
        btn.textContent = 'Login';
    }
});
</script>
</body>
</html>
